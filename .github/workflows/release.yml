name: Release

# Push a tag like `v0.1.0-beta.1` and this builds the Apple Silicon .dmg and
# attaches it to a GitHub Release. Tags carrying a prerelease suffix (anything
# after a `-`) are published as prereleases.
#
# Builds are unsigned: there is no Apple Developer ID certificate on this
# project. macOS quarantines the download, so users approve it once in System
# Settings. The release notes and README both say so.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true

permissions:
  contents: write

jobs:
  macos-arm64:
    # macos-latest has been Apple Silicon since macos-14.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          pkg="v$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test

      - name: Build the .dmg
        run: npm run dist:mac
        env:
          # Nothing to sign with, and the runner keychain should not quietly
          # supply an identity either.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Checksums
        working-directory: release
        run: shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            *-*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          read -r -d '' notes <<'NOTES' || true
          Apple Silicon only. Requires macOS 11 or later.

          This build is not signed with an Apple Developer ID, so macOS
          quarantines it. After dragging the app to Applications, open it once,
          dismiss the warning, then go to System Settings > Privacy & Security,
          scroll to Security, and click **Open Anyway** within the hour. macOS
          asks once; every launch after that is normal.

          Verify the download against `SHA256SUMS.txt`:

          ```
          shasum -a 256 -c SHA256SUMS.txt
          ```
          NOTES
          gh release create "$tag" \
            --title "$tag" \
            --verify-tag \
            --generate-notes \
            --notes "$notes" \
            $prerelease \
            release/*.dmg \
            release/SHA256SUMS.txt
