<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <title>PG Data Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- draggable titlebar strip (macOS hiddenInset) -->
    <div class="titlebar" id="titlebar">
      <span class="titlebar-name">PG Data Studio</span>
      <span class="titlebar-conn" id="titlebarConn"></span>
      <button class="titlebar-btn no-drag" id="disconnectBtn" hidden>Disconnect</button>
    </div>

    <!-- main workspace: database navigator (left) + data grid (right) -->
    <div class="app" id="app">
      <aside class="side" id="side">
        <div class="side-head">
          <span>Databases</span>
          <div class="side-tools">
            <button class="icon-btn" id="newSource" title="New data source" aria-label="New data source">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="tree-filter">
          <input class="tree-filter-input" id="tableFilter" spellcheck="false" autocomplete="off" placeholder="Filter tables…" aria-label="Filter tables" />
        </div>
        <div class="tree" id="tree"></div>
      </aside>

      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize"></div>

      <section class="main">
        <div class="toolbar">
          <div class="sql" id="sql"></div>
          <input class="filter" id="filter" placeholder="filter loaded rows…" aria-label="filter rows" />
          <div class="pager" id="pager" hidden>
            <button class="pager-btn" id="prevPage" title="Previous page" aria-label="Previous page" disabled>
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="pager-range" id="pageRange">1–0</span>
            <button class="pager-btn" id="nextPage" title="Next page" aria-label="Next page" disabled>
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="meta"><b id="rowcount">0</b> rows · <b id="ms">0</b> ms</div>
        </div>

        <div class="wherebar" id="wherebar">
          <span class="wherebar-kw">WHERE</span>
          <input
            class="wherebar-input"
            id="where"
            spellcheck="false"
            autocomplete="off"
            placeholder="price &gt; 100 AND code LIKE 'I%'   —   raw SQL, press Enter to apply"
            aria-label="WHERE clause"
          />
          <button class="wherebar-clear" id="whereClear" title="Clear filter" aria-label="Clear filter" hidden>×</button>
        </div>

        <div class="grid-scroll" id="gridScroll">
          <table id="grid">
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="empty" id="empty">Select a table to view its data.</div>
        </div>

        <div class="pending" id="pending">
          <div class="pending-head">
            <span class="badge" id="pcount">0 changes</span>
            <span class="lbl" id="pendingLbl"></span>
            <span class="spacer"></span>
            <button class="btn ghost" id="revert">Revert</button>
            <button class="btn primary" id="save">Save changes</button>
          </div>
          <div class="stmts" id="stmts"></div>
        </div>
      </section>
    </div>

    <div class="toast" id="toast"></div>

    <!-- source add/edit modal -->
    <div class="modal-backdrop" id="sourceModal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="none" aria-hidden="true" class="modal-icon">
            <ellipse cx="8" cy="3.5" rx="5.5" ry="2.2" stroke="currentColor" stroke-width="1.1"/>
            <path d="M2.5 3.5v9c0 1.2 2.5 2.2 5.5 2.2s5.5-1 5.5-2.2v-9" stroke="currentColor" stroke-width="1.1"/>
            <path d="M2.5 8c0 1.2 2.5 2.2 5.5 2.2s5.5-1 5.5-2.2" stroke="currentColor" stroke-width="1.1"/>
          </svg>
          <h2 id="modalTitle">New data source</h2>
          <button class="icon-btn" id="modalClose" title="Close" aria-label="Close">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="form-grid">
          <label class="field-label" for="srcName">Name</label>
          <input class="field" id="srcName" spellcheck="false" autocomplete="off" placeholder="My database" />

          <div class="form-row">
            <div class="form-col grow">
              <label class="field-label" for="srcHost">Host</label>
              <input class="field" id="srcHost" spellcheck="false" autocomplete="off" placeholder="localhost" />
            </div>
            <div class="form-col port">
              <label class="field-label" for="srcPort">Port</label>
              <input class="field" id="srcPort" type="number" inputmode="numeric" placeholder="5432" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-col grow">
              <label class="field-label" for="srcUser">User</label>
              <input class="field" id="srcUser" spellcheck="false" autocomplete="off" placeholder="postgres" />
            </div>
            <div class="form-col grow">
              <label class="field-label" for="srcPassword">Password</label>
              <input class="field" id="srcPassword" type="password" autocomplete="off" placeholder="••••••••" />
            </div>
          </div>

          <label class="field-label" for="srcDatabase">Database</label>
          <input class="field" id="srcDatabase" spellcheck="false" autocomplete="off" placeholder="postgres" />

          <label class="checkbox-row"><input type="checkbox" id="srcSsl" /> <span>Use SSL</span></label>

          <label class="field-label" for="srcUrl">URL <span class="hint">— edit to fill the fields above</span></label>
          <input class="field url" id="srcUrl" spellcheck="false" autocomplete="off" placeholder="postgres://user:password@localhost:5432/dbname" />
        </div>

        <div class="connect-error" id="connectError" hidden></div>

        <div class="form-actions">
          <span class="test-result" id="testResult"></span>
          <span class="spacer"></span>
          <button class="btn ghost" id="testSource">Test</button>
          <button class="btn ghost" id="saveSource">Save</button>
          <button class="btn primary" id="connectBtn">Connect</button>
        </div>
        <p class="connect-note">
          Saved locally in plaintext for convenience — same as a <code>.env</code> on your machine.
        </p>
      </div>
    </div>

    <!-- right-click menu for a data source -->
    <div class="ctx-menu" id="ctxMenu" hidden>
      <button class="ctx-item" data-act="edit">Edit…</button>
      <button class="ctx-item" data-act="duplicate">Duplicate</button>
      <button class="ctx-item" data-act="disconnect">Disconnect</button>
      <div class="ctx-sep"></div>
      <button class="ctx-item danger" data-act="delete">Delete</button>
    </div>

    <!-- per-column filter popover (anchored under a header's funnel icon) -->
    <div class="filter-pop" id="filterPop" hidden>
      <div class="filter-pop-col" id="fpCol"></div>
      <select class="filter-pop-op" id="fpOp" aria-label="Filter operator"></select>
      <input class="filter-pop-val" id="fpVal" spellcheck="false" autocomplete="off" placeholder="value" aria-label="Filter value" />
      <div class="filter-pop-btns">
        <button class="btn ghost" id="fpClear">Clear</button>
        <button class="btn primary" id="fpApply">Apply</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
